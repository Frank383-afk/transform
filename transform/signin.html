<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sing in</title>
    <link rel="stylesheet" href="signin.css">
</head>
<body>
    <div class="container">
<div class="card">
    <header>
        <h2>Log in</h2>
    </header>
    <div class="log-input">
        <div class="input"><label for="">Name</label><input type="text" id="nameone"></div>
        <div class="input"><label for="">Email</label><input type="email" id="emailone"></div>
        <div class="input"><label for="">Password</label><input type="password" id="passone"></div>
        <button id="done">Log in</button>
        <div class="accnone">
            <button id="accountbutton">Create account</button>
        </div>
    </div>
</div>
  <div class="card-two">
    <div class="info">
        <header>
            <h2>Create an Account</h2>
        </header>
        <div class="inputs-create">
          <div class="names">
            <div class="inputnames"><input type="text" placeholder="First name" id="firstname">
            <input type="text" placeholder="Last name" id="lastname"></div>
          </div>
          <div class="email">
            <div class="inputemail"><input type="email" placeholder="Email" id="email"><input type="password" placeholder="Password" id="password">
          </div>
        </div>
        <div class="location">
            <input type="" placeholder="Location" id="location">
           
        </div>
         <div class="buttons">
                <button id="createacc">Create account</button>
            </div>
    </div>
  </div>
 
    <div class="content">
        <header>
            <h2 id="htwo"></h2>
        </header>
        <div class="buttonsign">
            <button id="signup"></button>
        </div>
    </div>
  
  

    </div>
  <script src="signin.js"></script>
</body>
</html>
